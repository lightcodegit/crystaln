name: amneziawg-go binaries

# amneziawg-go does not ship prebuilt releases upstream, so we build the
# userspace daemon (linux amd64 + arm64) from the official amnezia-vpn source
# and publish it into our own "awg-go-bin" release. The desktop app downloads
# the binary at runtime (Settings -> "Обновить бинарники").
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Build amneziawg-go (amd64 + arm64)
        run: |
          git clone --depth 1 https://github.com/amnezia-vpn/amneziawg-go
          cd amneziawg-go
          go version
          for arch in amd64 arm64; do
            echo "== GOARCH=$arch =="
            CGO_ENABLED=0 GOARCH=$arch go build -trimpath -buildvcs=false -o "amneziawg-go-linux-$arch" .
          done
          ls -la amneziawg-go-linux-*

      - name: Publish to release awg-go-bin
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh release delete awg-go-bin --repo "$REPO" --cleanup-tag --yes 2>/dev/null || true
          gh release create awg-go-bin \
            --repo "$REPO" \
            --title "amneziawg-go (userspace AmneziaWG daemon)" \
            --notes "Собрано из исходников amnezia-vpn/amneziawg-go (upstream master), CGO_ENABLED=0." \
            amneziawg-go/amneziawg-go-linux-amd64 \
            amneziawg-go/amneziawg-go-linux-arm64
