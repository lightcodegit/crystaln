name: CrystalN CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false

      - name: Fetch Xray core bindings
        run: bash tools/fetch_cores.sh

      - name: Fetch Hysteria2 core
        run: bash tools/fetch_hysteria.sh

      - name: Run unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest --console=plain

      - name: Build debug APK
        run: ./gradlew --no-daemon :app:assembleDebug --console=plain

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: crystaln-android-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-results
          path: app/build/test-results/testDebugUnitTest/
          if-no-files-found: ignore

  desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false

      - name: Run desktop unit tests
        run: ./gradlew --no-daemon :desktop:test --console=plain

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm squashfs-tools libfuse2

      - name: Build desktop app and deb package
        run: ./gradlew --no-daemon :desktop:build :desktop:packageDistributionForCurrentOS --console=plain

      - name: Build AppImage
        run: ./gradlew --no-daemon :desktop:packageAppImage --console=plain

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-test-results
          path: desktop/build/test-results/test/
          if-no-files-found: ignore

      - name: Upload Linux packages
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: crystaln-linux
          path: |
            desktop/build/compose/binaries/**/*.deb
            desktop/build/compose/binaries/**/*.rpm
            desktop/build/compose/binaries/**/*.AppImage
          if-no-files-found: ignore

  # Сборка Linux-версии под Windows (прокси-режим; TUN только Linux).
  windows:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build and test desktop module
        shell: bash
        run: ./gradlew --no-daemon :desktop:test :desktop:createDistributable --console=plain

      - name: Build Windows installer (msi)
        shell: bash
        run: ./gradlew --no-daemon :desktop:packageMsi --console=plain

      - name: Upload Windows package
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: crystaln-windows-msi
          path: desktop/build/compose/binaries/main/msi/*.msi
          if-no-files-found: ignore
