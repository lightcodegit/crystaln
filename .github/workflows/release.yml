name: Release

# Публикует релиз по тегу v*: APK (Android), AppImage/rpm/deb (Linux),
# MSI (Windows). Приложение проверяет api.github.com/.../releases/latest —
# без релизов проверка обновлений всегда молчит.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
      - name: Fetch Xray core bindings
        run: bash tools/fetch_cores.sh
      - name: Fetch Hysteria2 core
        run: bash tools/fetch_hysteria.sh
      - name: Build APKs
        run: |
          ./gradlew --no-daemon :app:assembleDebug --console=plain
          ./gradlew --no-daemon :app:assembleRelease --console=plain
      - name: Collect APKs
        run: |
          mkdir -p dist
          ver="${{ github.ref_name }}"; ver="${ver#v}"
          # Ставится сразу: universal debug (все ABI, подписан debug-ключом).
          cp app/build/outputs/apk/debug/app-universal-debug.apk \
             "dist/crystaln-${ver}-debug.apk"
          # Послабленные debug-APK для конкретных ABI — кому нужен маленький.
          for f in app/build/outputs/apk/debug/app-*-debug.apk; do
            case "$f" in *universal*) continue ;; esac
            cp "$f" "dist/crystaln-${ver}-$(basename "$f" .apk | sed 's/^app-//').apk"
          done
          # Release-вариант подписывается секретами, если они заданы;
          # без подписи APK ставить нельзя, поэтому не публикуем его вовсе.
          if [ -n "$ANDROID_SIGNING_KEYSTORE" ]; then
            echo "$ANDROID_SIGNING_KEYSTORE" | base64 -d > signing.jks
            bt="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
            for f in app/build/outputs/apk/release/app-*-release-unsigned.apk; do
              out="dist/crystaln-${ver}-$(basename "$f" .apk | sed 's/^app-//; s/-release-unsigned/-release/').apk"
              "$bt/apksigner" sign \
                --ks signing.jks \
                --ks-key-alias "$ANDROID_SIGNING_KEY_ALIAS" \
                --ks-pass "pass:$ANDROID_SIGNING_KEY_PASSWORD" \
                --key-pass "pass:$ANDROID_SIGNING_KEY_KEY_PASSWORD" \
                --out "$out" "$f"
              rm -f "$f"
            done
            rm -f signing.jks
          fi
          ls -la dist
        env:
          ANDROID_SIGNING_KEYSTORE: ${{ secrets.ANDROID_SIGNING_KEYSTORE }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
          ANDROID_SIGNING_KEY_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: dist/*.apk
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm squashfs-tools libfuse2 fakeroot
      - name: Build AppImage, rpm and deb
        run: |
          ./gradlew --no-daemon :desktop:packageAppImage --console=plain
          ./gradlew --no-daemon :desktop:packageRpm --console=plain
          ./gradlew --no-daemon :desktop:packageDeb --console=plain || true
      - name: Collect packages
        run: |
          mkdir -p dist
          find desktop/build/compose/binaries -name "*.AppImage" -exec cp {} dist/ \;
          find desktop/build/compose/binaries -name "*.rpm" -exec cp {} dist/ \;
          find desktop/build/compose/binaries -name "*.deb" -exec cp {} dist/ \;
          ls -la dist
      - uses: actions/upload-artifact@v7
        with:
          name: linux-packages
          path: dist/*
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - name: Build Windows installer (msi)
        shell: bash
        run: ./gradlew --no-daemon :desktop:packageMsi --console=plain
      - name: Collect package
        shell: bash
        run: |
          mkdir -p dist
          ver="${GITHUB_REF_NAME#v}"
          # Имя файла = версия тега (внутри MSI версия из appVersion).
          cp desktop/build/compose/binaries/main/msi/*.msi "dist/crystaln-${ver}.msi"
          ls -la dist
      - uses: actions/upload-artifact@v7
        with:
          name: windows-package
          path: dist/*
          if-no-files-found: error

  publish:
    needs: [android, linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Show artifacts
        run: ls -la dist
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: CrystalN ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: |
            dist/*
          body: |
            ## CrystalN ${{ github.ref_name }}

            **Android:** `crystaln-VERSION-debug.apk` (universal — ставится сразу на любой телефон),
            `crystaln-VERSION-<abi>-debug.apk` (послабленные, под конкретный ABI)
            и `crystaln-VERSION-<abi>-release.apk` (подписаны release-ключом, если он настроен)
            **Linux:** `crystaln-*.AppImage` (универсально), `*.rpm` (Fedora/openSUSE), `*.deb` (Debian/Ubuntu)
            **Windows:** `crystaln-VERSION.msi` (ставится в Program Files, ярлык в меню «Пуск»)

            AppImage: `chmod +x crystaln-*.AppImage && ./crystaln-*.AppImage`
            Меню приложений: Gear Lever или `tools/setup.sh install`
