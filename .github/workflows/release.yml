name: Release

# Публикует релиз по тегу v*: APK (Android), AppImage/rpm/deb (Linux).
# Приложение проверяет api.github.com/.../releases/latest — без релизов
# проверка обновлений всегда молчит.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Fetch Xray core bindings
        run: bash tools/fetch_cores.sh
      - name: Build release APK
        run: ./gradlew --no-daemon :app:assembleRelease --console=plain
      - name: Collect APKs
        run: |
          mkdir -p dist
          find app/build/outputs/apk -name "*.apk" -exec cp {} dist/ \;
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist/*.apk
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm squashfs-tools libfuse2 fakeroot
      - name: Build AppImage, rpm and deb
        run: |
          ./gradlew --no-daemon :desktop:packageAppImage --console=plain
          ./gradlew --no-daemon :desktop:packageRpm --console=plain
          ./gradlew --no-daemon :desktop:packageDeb --console=plain || true
      - name: Collect packages
        run: |
          mkdir -p dist
          find desktop/build/compose/binaries -name "*.AppImage" -exec cp {} dist/ \;
          find desktop/build/compose/binaries -name "*.rpm" -exec cp {} dist/ \;
          find desktop/build/compose/binaries -name "*.deb" -exec cp {} dist/ \;
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: dist/*
          if-no-files-found: error

  publish:
    needs: [android, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Show artifacts
        run: ls -la dist
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: CrystalN ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: |
            dist/*
          body: |
            ## CrystalN ${{ github.ref_name }}

            **Android:** `app-release*.apk` (или `app-debug.apk` из CI-сборки)
            **Linux:** `crystaln-*.AppImage` (универсально), `*.rpm` (Fedora/openSUSE), `*.deb` (Debian/Ubuntu)

            AppImage: `chmod +x crystaln-*.AppImage && ./crystaln-*.AppImage`
            Меню приложений: Gear Lever или `tools/setup.sh install`
